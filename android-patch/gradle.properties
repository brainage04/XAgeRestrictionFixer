org.gradle.parallel = true
org.gradle.caching = true
kotlin.code.style = official
version = 1.0.0

# The extension is plain Java. With AGP's built-in Kotlin on, AGP adds kotlin-stdlib to it, and
# the whole standard library would end up in extension.mpe and be merged into X's own Kotlin classes.
android.builtInKotlin = false

# The Morphe settings plugin always declares GitHub Packages and reads gpr.user/gpr.key (or
# GITHUB_ACTOR/GITHUB_TOKEN) with a non-null get() while configuring, although every Morphe artifact
# resolves from Maven local (scripts/install-morphe-tooling.sh). These placeholders are only sent if
# an artifact is missing from Maven local; a real gpr.user/gpr.key in ~/.gradle/gradle.properties
# takes precedence over them.
gpr.user = anonymous
gpr.key = unused
